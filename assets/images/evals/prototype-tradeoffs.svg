<svg xmlns="http://www.w3.org/2000/svg" width="800" height="541" viewBox="0 0 800 541" role="img" aria-labelledby="title desc">
<title id="title">Prototype cost and latency comparisons</title><desc id="desc">Approximate cost per turn: prototype $0.0031, reference $0.041. Median latency: prototype 8.7 seconds, reference 13.7 seconds. Multiple configuration changes prevent attributing the gains to batching alone.</desc>
