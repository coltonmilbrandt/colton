<g font-family="Arial, sans-serif"><text x="40" y="48" fill="#83ddd0" font-size="20" letter-spacing="2">03 / LATER PROTOTYPE</text><text x="40" y="94" fill="#eaf2fb" font-size="32" font-weight="700">Two gains. A different configuration.</text><text x="40" y="153" fill="#9db8da" font-size="23" >COST / TURN</text><text x="760" y="153" fill="#83ddd0" font-size="32" text-anchor="end" font-weight="700">≈92% lower</text><text x="40" y="201" fill="#83ddd0" font-size="25" >Prototype $0.0031</text><text x="760" y="201" fill="#9db8da" font-size="25" text-anchor="end">Reference $0.041</text><line x1="40" y1="248" x2="760" y2="248" stroke="#30465e" /><line x1="84.63999999999999" y1="248" x2="630.4" y2="248" stroke="#598c9e" stroke-width="5"/><circle cx="630.4" cy="248" r="9" fill="#9db8da"/><circle cx="84.63999999999999" cy="248" r="13" fill="#83ddd0"/><circle cx="84.63999999999999" cy="248" r="5" fill="#122339"/><text x="40" y="292" fill="#9db8da" font-size="20" >0</text><text x="760" y="292" fill="#9db8da" font-size="20" text-anchor="end">$0.05</text><line x1="40" y1="320" x2="760" y2="320" stroke="#30465e" /><text x="40" y="367" fill="#9db8da" font-size="23" >MEDIAN LATENCY</text><text x="760" y="367" fill="#83ddd0" font-size="32" text-anchor="end" font-weight="700">≈36% lower</text><text x="40" y="415" fill="#83ddd0" font-size="25" >Prototype 8.7 s</text><text x="760" y="415" fill="#9db8da" font-size="25" text-anchor="end">Reference 13.7 s</text><line x1="40" y1="462" x2="760" y2="462" stroke="#30465e" /><line x1="457.59999999999997" y1="462" x2="697.6" y2="462" stroke="#598c9e" stroke-width="5"/><circle cx="697.6" cy="462" r="9" fill="#9db8da"/><circle cx="457.59999999999997" cy="462" r="13" fill="#83ddd0"/><circle cx="457.59999999999997" cy="462" r="5" fill="#122339"/><text x="40" y="506" fill="#9db8da" font-size="20" >0</text><text x="760" y="506" fill="#9db8da" font-size="20" text-anchor="end">15 seconds</text></g></svg>