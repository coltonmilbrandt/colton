<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title desc">
<title id="title">A passing score was only the beginning</title><desc id="desc">Initial candidate passed six of six scenarios. In a separate repeated gate it passed twelve of fifteen runs. Tiles are grouped by outcome, not chronology. A promising start earned further testing, not a release.</desc>
<defs><radialGradient id="glow" cx="100%" cy="0%" r="100%"><stop stop-color="#244f60"/><stop offset="1" stop-color="#122339"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#adc7dc" opacity=".12"/></pattern></defs>
<rect width="800" height="580" rx="18" fill="url(#glow)"/><rect width="800" height="580" rx="18" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="40" y="48" fill="#83ddd0" font-size="20" letter-spacing="2">MINDYCART / EVALUATION FIELD NOTES</text><text x="40" y="108" fill="#eaf2fb" font-size="38" font-weight="700">What a passing score can miss.</text><text x="40" y="148" fill="#9db8da" font-size="24" >Different tests. Different product decisions.</text><line x1="40" y1="181" x2="760" y2="181" stroke="#30465e" /><text x="40" y="222" fill="#9db8da" font-size="19" letter-spacing="1">FIRST SIGNAL</text><text x="430" y="222" fill="#9db8da" font-size="19" letter-spacing="1">REPEATED GATE</text><text x="40" y="290" fill="#83ddd0" font-size="64" font-weight="700">6/6</text><text x="430" y="290" fill="#83ddd0" font-size="64" font-weight="700">12/15</text><text x="40" y="326" fill="#9db8da" font-size="21" >candidate scenarios passed</text><text x="430" y="326" fill="#9db8da" font-size="21" >candidate runs passed</text><line x1="365" y1="249" x2="397" y2="249" stroke="#9db8da" stroke-width="2"/><path d="M389 242 L397 249 L389 256" fill="none" stroke="#9db8da" stroke-width="2"/><rect x="40" y="352" width="31" height="31" rx="6" fill="#83ddd0"/><rect x="83" y="352" width="31" height="31" rx="6" fill="#83ddd0"/><rect x="126" y="352" width="31" height="31" rx="6" fill="#83ddd0"/><rect x="169" y="352" width="31" height="31" rx="6" fill="#83ddd0"/><rect x="212" y="352" width="31" height="31" rx="6" fill="#83ddd0"/><rect x="255" y="352" width="31" height="31" rx="6" fill="#83ddd0"/><rect x="430" y="352" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="473" y="352" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="516" y="352" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="559" y="352" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="602" y="352" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="430" y="395" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="473" y="395" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="516" y="395" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="559" y="395" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="602" y="395" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="430" y="438" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="473" y="438" width="31" height="31" rx="6" fill="#83ddd0" stroke="#83ddd0"/><rect x="516" y="438" width="31" height="31" rx="6" fill="#352f43" stroke="#df9ea9"/><line x1="525" y1="447" x2="538" y2="460" stroke="#df9ea9" stroke-width="2"/><line x1="538" y1="447" x2="525" y2="460" stroke="#df9ea9" stroke-width="2"/><rect x="559" y="438" width="31" height="31" rx="6" fill="#352f43" stroke="#df9ea9"/><line x1="568" y1="447" x2="581" y2="460" stroke="#df9ea9" stroke-width="2"/><line x1="581" y1="447" x2="568" y2="460" stroke="#df9ea9" stroke-width="2"/><rect x="602" y="438" width="31" height="31" rx="6" fill="#352f43" stroke="#df9ea9"/><line x1="611" y1="447" x2="624" y2="460" stroke="#df9ea9" stroke-width="2"/><line x1="624" y1="447" x2="611" y2="460" stroke="#df9ea9" stroke-width="2"/><text x="40" y="509" fill="#eaf2fb" font-size="25" >A promising start earned another test—not a release.</text><text x="40" y="547" fill="#9db8da" font-size="20" >Separate test sets · tiles grouped by outcome</text></g></svg>