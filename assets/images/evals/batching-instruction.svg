<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="title desc">
<title id="title">When the score fools you: same model, one sentence, 0 of 18 to 6 of 6</title><desc id="desc">Across three reasoning settings, zero of eighteen runs batched every search into one response. With one added sentence, six of six did. On the six-scenario run the candidate went from five of six passes to six of six, from 5.3 to 4.0 model round trips per turn, and from a 12.6 to an 8.0 second median turn. The reference model median turn fell from 10.6 to 7.8 seconds.</desc>
<defs><radialGradient id="glow" cx="100%" cy="0%" r="100%"><stop stop-color="#244f60"/><stop offset="1" stop-color="#122339"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#adc7dc" opacity=".12"/></pattern></defs>
